<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>guo.gx · Git Pages</title>
  <style>
    :root {
      --bg0: #0c1222;
      --bg1: #152238;
      --ink: #e8eef8;
      --muted: #9aacc4;
      --line: rgba(232, 238, 248, 0.12);
      --accent: #5eead4;
      --accent-dim: #2dd4bf;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background:
        radial-gradient(ellipse 90% 60% at 15% -10%, rgba(45, 212, 191, 0.18), transparent 55%),
        radial-gradient(ellipse 70% 50% at 95% 10%, rgba(96, 165, 250, 0.14), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #0a101c);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .wrap {
      width: min(720px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 18vh 0 3rem;
      flex: 1;
    }

    .brand {
      font-size: clamp(2.6rem, 8vw, 4.2rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin: 0 0 0.75rem;
    }

    .brand span {
      color: var(--accent);
    }

    .lead {
      margin: 0 0 1.75rem;
      max-width: 34rem;
      font-size: 1.1rem;
      line-height: 1.65;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.7rem 1.1rem;
      border-radius: 0.4rem;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    a.btn:hover { transform: translateY(-1px); }

    a.btn-primary {
      background: var(--accent);
      color: #042f2e;
    }

    a.btn-primary:hover { background: var(--accent-dim); }

    a.btn-ghost {
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(255, 255, 255, 0.03);
    }

    a.btn-ghost:hover { border-color: rgba(94, 234, 212, 0.45); }

    .meta {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .meta code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      color: #c4d4e8;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.1rem 0.35rem;
      border-radius: 0.25rem;
    }

    footer {
      width: min(720px, calc(100% - 2.5rem));
      margin: 0 auto 1.5rem;
      font-size: 0.8rem;
      color: rgba(154, 172, 196, 0.75);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">guo<span>.gx</span></h1>
    <p class="lead">
      组织 GitHub Pages 入口。静态站托管在这里；各项目站挂在同域子路径下。
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/test/">打开 test 项目站</a>
      <a class="btn btn-ghost" href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
    <p class="meta">
      自定义域：<code>git.guo.gx.cn</code><br />
      组织站仓库名须为 <code>组织名.github.io</code>；本文件放在该仓库根目录即可。
    </p>
  </div>
  <footer>GitHub Pages · organization site</footer>
</body>
</html>
